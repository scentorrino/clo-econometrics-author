#
# Quarto shell for panel-npiv-discrete.
#
# DESIGN, and the reason it is a shell rather than a translation.
#
# The theory corpus is LaTeX: 136 theorem-like environments and 2,038 \cref /
# \eqref calls across results.tex, proofs.tex and assumptions.tex. Translating
# that into markdown would destroy the cross-reference graph AND the tooling
# built on it -- check_rendering_sync.py's label-based CHECK 1/4/6/8, the 117
# symbolic specs' source pointers, and every narrow critic's line citations.
#
# So the .qmd files own the PROSE and \input the theory verbatim inside raw
# LaTeX blocks. Quarto renders pdf via pandoc -> LaTeX -> xelatex, so raw blocks
# pass through untouched and amsthm, cleveref and biblatex all behave as they do
# in the scratch driver that already builds this corpus at 312 pages.
#
# DO NOT use Quarto's native theorem syntax (::: {#thm-foo}). It maintains its
# own counter and its own \label scheme, and would collide with the 136 amsthm
# environments and the \cref graph the corpus already has. One theorem system.
project:
  type: default
  output-dir: _output

format:
  pdf:
    # pdflatex, NOT the project's xelatex, and the reason is specific.
    # Quarto's xelatex template loads unicode-math unconditionally (main.tex:16),
    # which fights the project preamble's lmodern + T1 fontenc + amssymb + dsfont
    # setup and dies on \g__um_prime_font_cmd_tl. That preamble is pdflatex-native
    # and merely TOLERATES xelatex because the scratch driver never loads
    # unicode-math. Under pdflatex, pandoc takes the \ifPDFTeX branch and the two
    # agree. If the project ever needs xelatex here (system fonts, CJK), the fix
    # is a custom pandoc template, not a preamble change -- the preamble is shared
    # with the working build.
    pdf-engine: pdflatex
    documentclass: article
    classoption: [12pt]
    # The project preamble carries amsthm, the custom macros (\IR 315 uses,
    # \vdagger 142, \upmodels 19), hyperref-then-cleveref ordering, and the
    # working-paper layout required by .claude/rules/working-paper-format.md.
    include-in-header:
      - ../preambles/preamble.tex
    # biblatex + biber, NOT pandoc's citeproc. INV-9 requires it, and the
    # bibliography resolves 72 entries only through \addbibresource.
    cite-method: biblatex
    biblio-style: authoryear
    keep-tex: true
    # Keep the LaTeX .log. Quarto deletes intermediates by default, and the .log
    # is the ONLY place undefined references, multiply-defined labels and
    # unresolved citations are recorded -- all three are warnings, so quarto
    # still exits 0 and the PDF still renders "[?]". scripts/render-paper/render.sh
    # reads this file; without it that script is blind and says so.
    latex-clean: false
    number-sections: true
