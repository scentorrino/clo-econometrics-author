claim_id: frontier-exponent-composition
source: "quality_reports/theory/panel-npiv-discrete/assumptions.tex (A5(ii) into A5(iii))"
# CLAIM (the step that PRODUCES the frontier's left-hand side).  A5(ii) sets
# delta_n = hat-delta_n^{2mu/(2mu+1)}; A4(iii)/A5(iii) set
# hat-delta_n = n^{-r/(2r+d_Z)}.  Composing the two exponents,
#     delta_n = n^{-(2mu/(2mu+1)) * (r/(2r+d_Z))},
# so delta_n = o(n^{-1/4}) is exactly the condition that the composed exponent
# exceed 1/4 -- which is eq:frontier.  This spec verifies the exponent algebra
# (n^a)^b = n^{ab} in the form the assumption uses it.
variables:
  n:
    domain: positive
  mu:
    domain: positive
  r:
    domain: positive
  d_Z:
    domain: positive
start: "(n**(-r/(2*r+d_Z)))**(2*mu/(2*mu+1))"
operation: none
claimed_end: "n**(-(2*mu/(2*mu+1))*(r/(2*r+d_Z)))"
