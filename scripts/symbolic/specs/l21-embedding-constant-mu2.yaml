claim_id: l21-embedding-constant-mu2
source: "quality_reports/theory/panel-npiv-discrete/results.tex (eq:embedconst; lem:reprsmooth Steps 1 and 1')"
# WHAT THIS CHECKS.  The embedding constant of eq:embedconst,
#     c_{mu''} = ( (2/pi) * INT_R (1 + xi^2)^{1 - mu''} d xi )^{1/2},
# evaluated at mu'' = 2, where the integral is elementary:
#     INT_R (1 + xi^2)^{-1} d xi = pi,   so   c_2^2 = (2/pi) * pi = 2,
# hence c_2 = sqrt(2).  The spec checks the SQUARE, which is the rational
# quantity the formula produces, rather than the square root, so that the
# comparison target is exact and no radical simplification is involved.
#
# WHY THIS SPEC EXISTS, and it is a correction as much as a check.
# rem:l21route(d) records that at mu'' = 2 the embedding can be proved with NO
# Fourier transform, by the elementary Gagliardo-Nirenberg argument of Step 1',
# which yields the constant 2.  The Fourier route of Step 1 yields sqrt(2) at the
# SAME index.  Those two numbers are both correct and they are NOT the same, and
# a reader meeting "c_{mu''} replaced by 2" next to "c_2 = sqrt 2" would be
# entitled to think one of them is wrong.  Neither is: the elementary route is
# TRANSFORM-FREE AND WEAKER, sqrt(2) < 2, and the paper now says so in both
# places.  This spec pins the sharper of the two.
#
# WHAT A MISMATCH WOULD MEAN.  Either the 2/pi normalisation of eq:embedconst is
# wrong -- it tracks the Fourier convention fixed in eq:usobolev, where the
# H^{mu''} norm carries 1/(2 pi) and inversion carries 1/(2 pi) -- or the
# arithmetic collecting 2 (2 pi)^{1/2} / (2 pi) into (2/pi)^{1/2} is wrong.  Both
# are places a constant can be lost, and both are checked here at one index.
#
# WHAT THIS DOES NOT CHECK.  It does not check the embedding itself, which is not
# a symbolic identity, and it does not check the THRESHOLD; that is the separate
# spec l21-threshold-binding.
#
# PREDICTED: MATCH.  integrate(1/(1+xi**2), (xi, -oo, oo)) is one of SymPy's
# standard closed forms and returns pi.
variables:
  xi:
    domain: real
start: "(2/pi) * integrate(1/(1 + xi**2), (xi, -oo, oo))"
operation: simplify
claimed_end: "2"
