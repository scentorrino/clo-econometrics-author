claim_id: cap-window-lower
source: "quality_reports/theory/panel-npiv-discrete/results.tex (the display in lem:scaleinv's closing: 'omega_n^2 asymp n^{0.08} h_x^{-1} in (n^{0.208}, n^{0.52}), bar-m_n >= omega_n^2 hat-delta_n^{-2} in (n^{0.848}, n^{1.16}) against hat-delta_n^{-2} = n^{0.64}'); the window's provenance at assumptions.tex"
# WHAT THIS CHECKS.  The LOWER endpoint n^{0.848} of the repriced cap, recomputed
# from the general identity of cap-omega-exponent by substituting the
# frontier-clearing configuration (mu, s, a, alpha) = (2, 3, 3/4, 0.32) of
# rem:h6bandwidth(5):
#
#     beta_u = 1/25   ( h_u asymp n^{-alpha/8} = n^{-0.04}; spec cap-hu-exponent-c5i )
#     beta_x = 16/125 ( the UPPER end of the h_x window, h_x = O(n^{-0.128}), from
#                       (P-g); spec cap-hx-upper-pg -- and the upper end of the h_x
#                       window is the LOWER end of the cap, since omega_n^2 carries
#                       h_x^{-1} )
#     alpha  = 8/25   ( hat-delta_n = n^{-0.32} )
#
#     2*(1/25) + 16/125 + 2*(8/25)  =  10/125 + 16/125 + 80/125  =  106/125  =  0.848 .
#
# ALL THREE INPUTS ARE WRITTEN AS EXACT RATIONALS.  0.04 = 1/25, 0.128 = 16/125,
# 0.32 = 8/25, 0.848 = 106/125.  Decimal literals would parse to SymPy Floats and
# the comparison would be inexact; the rational forms make the check exact, and
# they also make visible that the paper's three-decimal 0.848 is not a rounding
# but the exact value.
#
# WHAT THE SIGN OF THE COMPARISON IS.  0.848 > 0.64 = 2*alpha, so even at the
# CHEAP end of the h_x window the cap exceeds the round-9 cap
# hat-delta_n^{-2} = n^{0.64} by n^{0.208}.  There is no configuration in the
# admissible window at which the repricing is free.
#
# WHAT THIS DOES NOT CHECK.  That the window (n^{-0.44}, n^{-0.128}) for h_x is
# itself correct -- that is cap-hx-lower-c5ii and cap-hx-upper-pg -- nor that
# (2, 3, 3/4, 0.32) is admissible, which is rem:h6bandwidth(5)'s four separate
# clearances (eq:frontier, (P-f), eq:lxwindow, A8) and is not a symbolic identity.
#
# FALSIFICATION (hand-computed).  claimed_end "n**(107/125)" leaves residual
# n^{106/125} - n^{107/125}, nonzero for n > 1; MISMATCH.  Substituting
# beta_x = 11/25 instead (the other endpoint) gives 29/25 != 106/125; MISMATCH.
# So neither the target nor the endpoint choice can be perturbed silently.
#
# PREDICTED: MATCH.
variables:
  n:
    domain: positive
  beta_u:
    domain: positive
  beta_x:
    domain: positive
  alpha:
    domain: positive
start: "(n**(-beta_u))**(-2) * (n**(-beta_x))**(-1) * (n**(-alpha))**(-2)"
operation: "substitute(beta_u=1/25, beta_x=16/125, alpha=8/25)"
claimed_end: "n**(106/125)"
