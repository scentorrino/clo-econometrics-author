claim_id: a8-window-polynomials
source: "quality_reports/theory/panel-npiv-discrete/assumptions.tex ('polynomials L_x << n^{1/3} ==> window non-empty iff s > 3/2')"
# CLAIM (the counterfactual basis).  With L_x << n^{1/3} the window is non-empty
# iff 1/(2s) < 1/3, i.e. iff s > 3/2:
#     1/3 - 1/(2s) = (2s - 3)/(6s).
# This is what makes the choice of basis part of the assumption rather than a
# presentational detail.
variables:
  s:
    domain: positive
start: "1/3 - 1/(2*s)"
operation: none
claimed_end: "(2*s-3)/(6*s)"
