claim_id: nprate-p2-d1
source: "quality_reports/theory/panel-npiv-discrete/assumptions.tex (A4(iii), rate n^{-r/(2r+d_Z)})"
# CLAIM.  The general nonparametric rate exponent -p/(2p+d) at p = 2, d = 1 is
# -2/5, i.e. the rate is n^{-2/5}.
variables:
  p:
    domain: positive
  d:
    domain: positive
start: "-p/(2*p+d)"
operation: "substitute(p=2, d=1)"
claimed_end: "-2/5"
