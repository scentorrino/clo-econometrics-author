# The threshold is recomputed FROM THE GENERAL FORMULA r > d_Z(2mu+1)/(2(2mu-1))
# and compared with the value printed in the comment block.
#
# ROUND-12 UPDATE.  THIS SPEC IS NOW THE ONE THAT MATCHES WHAT THE PAPER PRINTS,
# and the round-7 note that used to sit here -- "the printed entry is a 2-decimal
# rounding" -- IS NO LONGER TRUE and is struck.  The mu = 2 row is now printed as
# EXACT FRACTIONS (assumptions.tex), so the printed entry at (2, 5) is
# 25/6, exactly what this spec claims.
#
# The '-printed' variant is RETAINED as a by-design MISMATCH and a retirement
# record; its residual -1/300 is negative, i.e. the withdrawn rendering 4.17 sat
# ABOVE the true threshold and was conservative -- the opposite direction from the
# d_Z = 4 entry, which is the whole reason the row was converted to fractions.  See
# frontier-table-mu2-dz5-printed.yaml and frontier-table-rounding-dz5.yaml.
#
# The line reference above was previously 'L452-459', which the file has outgrown;
# the table now sits at assumptions.tex.
#
# PREDICTED: MATCH.
variables:
  mu:
    domain: positive
  d_Z:
    domain: positive
start: "d_Z*(2*mu+1)/(2*(2*mu-1))"
operation: "substitute(mu=2, d_Z=5)"
claimed_end: "25/6"
