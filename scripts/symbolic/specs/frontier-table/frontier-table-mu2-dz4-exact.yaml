claim_id: frontier-table-mu2-dz4-exact
source: "quality_reports/theory/panel-npiv-discrete/assumptions.tex (A5(iii) substitution table, mu = 2 row: 'r > 5/2  r > 10/3  r > 25/6'); general formula eq:frontier at assumptions.tex"
# Table entry (mu = 2, d_Z = 4) of the eighteen-entry substitution table.
# The threshold is recomputed FROM THE GENERAL FORMULA r > d_Z(2mu+1)/(2(2mu-1))
# and compared with the value printed in the comment block.
#
# ROUND-12 UPDATE.  THIS SPEC IS NOW THE ONE THAT MATCHES WHAT THE PAPER PRINTS,
# and the round-7 note that used to sit here -- "the printed entry is a 2-decimal
# rounding" -- IS NO LONGER TRUE and is struck.  The mu = 2 row is now printed as
# EXACT FRACTIONS, deliberately, because the round-2 rendering 'r > 3.33' rounded a
# strict lower bound DOWN while 'r > 4.17' rounded 25/6 UP, i.e. the same row was
# rendered to two opposite conventions (assumptions.tex).  So the printed
# entry at (2, 4) is 10/3, exactly what this spec claims, and it is the '-exact'
# variant and not the '-printed' one that now tracks the paper.
#
# The '-printed' variant is RETAINED as a by-design MISMATCH and a retirement
# record; its residual 1/300 is the quantity assumptions.tex cites as the
# reason for printing fractions.  See frontier-table-mu2-dz4-printed.yaml for the
# full re-verification, and frontier-table-rounding-dz4.yaml for the positive
# assertion of that residual.
#
# The line reference above was previously 'L452-459', which the file has outgrown;
# the table now sits at assumptions.tex.  The same stale reference is
# carried by the other sixteen frontier-table specs and is reported rather than
# edited across all of them.
#
# PREDICTED: MATCH.
variables:
  mu:
    domain: positive
  d_Z:
    domain: positive
start: "d_Z*(2*mu+1)/(2*(2*mu-1))"
operation: "substitute(mu=2, d_Z=4)"
claimed_end: "10/3"
