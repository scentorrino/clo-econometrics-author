claim_id: frontier-equivalence
source: quality_reports/theory/panel-npiv-discrete/assumptions.tex (A5(iii), eq:frontier)
# CLAIM.  (2mu/(2mu+1)) * (r/(2r+d_Z)) > 1/4   <==>   r > d_Z(2mu+1)/(2(2mu-1)).
# The inequality equivalence is not directly decidable by verify.py, so it is
# reduced to the single algebraic identity that carries it: the difference
# LHS - 1/4 written over a manifestly positive denominator.  Given mu,r,d_Z > 0
# the denominator 4(2mu+1)(2r+d_Z) is positive, so the sign of the difference is
# the sign of the numerator 2r(2mu-1) - d_Z(2mu+1).  That numerator is positive
# iff 2mu-1 > 0 and r > d_Z(2mu+1)/(2(2mu-1)) -- which is the claim, INCLUDING
# the necessity of mu > 1/2 (at 2mu-1 <= 0 the numerator is <= -d_Z(2mu+1) < 0
# for every r > 0).
variables:
  mu:
    domain: positive
  r:
    domain: positive
  d_Z:
    domain: positive
start: "2*mu/(2*mu+1) * r/(2*r+d_Z) - 1/4"
operation: none
claimed_end: "(2*r*(2*mu-1) - d_Z*(2*mu+1)) / (4*(2*mu+1)*(2*r+d_Z))"
