claim_id: bdiff-union-exponent
source: "quality_reports/theory/panel-npiv-discrete/proofs.tex (prp:phirate Step 1, (N2.3), the union bound: '9^{L_x} exp(-c_18 n_m/L_x) = exp(L_x ln 9 - c_18 n_m/L_x), which tends to zero if and only if L_x^2 = o(n_m), i.e. -- under A9's n_m asymp n of eq:foldbal -- if and only if L_x = o(n^{1/2}), which is A8's own upper end'); lem:bdiff(ii) at proofs.tex; the net cardinality N <= 9^{L_x} at proofs.tex"
# WHAT THIS CHECKS.  That the Bernstein exponent of lem:bdiff(ii) dominates the
# volumetric entropy of the 1/4-net, and that the condition the paper states is
# EXACTLY the condition under which the product vanishes.
#
# The two ingredients are: net cardinality N <= 9^{L_x} (volumetric bound on an
# L_x-dimensional sphere at radius 1/4), and per-point tail
# exp(-c_18 n_m/L_x) with c_18 = 3K/(8 (4 c_C c_2 c_11)^2) > 0, from lem:bdiff(ii)
# at N = n_m, s = K, B asymp L_x.  Their product's exponent factorises as
#
#     L_x ln 9  -  c_18 n_m / L_x   =   L_x ( ln 9  -  c_18 n_m / L_x^2 ) .
#
# THE FACTORISATION IS THE WHOLE ARGUMENT.  L_x -> infinity, so the product tends
# to zero if and only if the BRACKET is eventually negative and bounded away from
# zero, i.e. if and only if n_m/L_x^2 -> infinity, i.e. L_x^2 = o(n_m).  Under A9's
# n_m asymp n that is L_x = o(n^{1/2}), which is A8's own upper end -- so the
# uniformity step costs the block NOTHING beyond A8.  The claimed condition is not
# sufficient-and-maybe-more: it is the exact threshold, and the factorisation is
# what shows that.
#
# WHY THE EXPONENT PLACEMENT MATTERS, and it is what clause (ii) bought.  Read
# lem:bdiff's own justification (proofs.tex): clause (i) is
# variance-blind and returns an exponent linear in n_m/L_x^2, whose factorisation
# is L_x (ln 9 - c n_m/L_x^3) and which therefore needs L_x^3 = o(n_m), i.e.
# L_x = o(n^{1/3}) -- strictly inside A8.  Clause (ii) replaces one factor of the
# range bound B by the mean bound K, moving L_x^2 to L_x in the exponent and
# L_x^3 to L_x^2 in the surviving condition.  The companion spec
# bdiff-clause-i-penalty mechanises the clause-(i) version so that the two
# exponents can be compared as algebra rather than as prose.
#
# WHAT THIS DOES NOT CHECK -- DECLARED GAPS.  (a) It does not check the elementary
# step 9^{L_x} = exp(L_x ln 9), which the paper performs in the same display and
# which is a^b = e^{b ln a}; the spec starts from the exponent form because SymPy's
# powsimp is not reliable at converting exp(x log 9) back to 9^x with x symbolic,
# and a spec that MISMATCHED on that would be a harness artefact.  (b) It does not
# check the volumetric bound N <= 9^{L_x} itself (lem:unifop(3d)), nor c_18 > 0,
# nor the symmetric-form step linking net points to the supremum
# (proofs.tex) -- that step is an inequality about a self-adjoint form and
# is not symbolic.  (c) It does not check the "if and only if": the bracket's sign
# behaviour is a limit statement, and what is mechanised is the FACTORISATION that
# makes the limit statement immediate.  The boundary half is the companion spec
# bdiff-union-boundary.
#
# FALSIFICATION (hand-computed).  claimed_end "L_x*(log(9) - c18*n_m/L_x**3)"
# leaves residual c18*n_m/L_x - c18*n_m/L_x**2, nonzero; MISMATCH -- and that is
# precisely the clause-(i) exponent, so the spec discriminates the two clauses of
# lem:bdiff.  claimed_end "L_x*log(9) - c18*n_m/L_x**2" leaves residual
# c18*n_m/L_x**2 - c18*n_m/L_x, nonzero; MISMATCH.
#
# PREDICTED: MATCH.  Pure polynomial/rational algebra; `expand` alone suffices.
variables:
  L_x:
    domain: positive
  n_m:
    domain: positive
  c18:
    domain: positive
start: "L_x*log(9) - c18*n_m/L_x"
operation: none
claimed_end: "L_x*(log(9) - c18*n_m/L_x**2)"
