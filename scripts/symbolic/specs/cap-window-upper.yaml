claim_id: cap-window-upper
source: "quality_reports/theory/panel-npiv-discrete/results.tex (the display in lem:scaleinv's closing, upper endpoint n^{1.16}); the window's provenance at assumptions.tex"
# WHAT THIS CHECKS.  The UPPER endpoint n^{1.16} of the repriced cap, from the
# same identity as cap-window-lower with beta_x at the LOWER end of the h_x
# window, h_x >> n^{-0.44} (C5'(ii); spec cap-hx-lower-c5ii):
#
#     beta_u = 1/25,  beta_x = 11/25,  alpha = 8/25 ,
#     2*(1/25) + 11/25 + 2*(8/25) = 10/125 + 55/125 + 80/125 = 145/125 = 29/25 = 1.16 .
#
# 1.16 = 29/25 exactly; 0.44 = 11/25 exactly.  As in cap-window-lower the inputs
# are exact rationals so the check is exact.
#
# THE ONE READING THIS SPEC PINS.  The cap exponent EXCEEDS 1 at this endpoint:
# 29/25 = 1.16 > 1.  So at the small-h_x end of the admissible window the
# iteration cap is superlinear in n, which is a materially different statement
# from the round-9 cap n^{0.64}.  It is also why results.tex says the
# inflation factor is "decreasing in h_x, so the upper end of the h_x window is
# also the cheap end of the cap": omega_n^2 carries h_x^{-1}, so a LARGER h_x
# (smaller beta_x) gives a SMALLER cap.  The two endpoint specs together are that
# monotonicity, evaluated at the two ends.
#
# WHAT THIS DOES NOT CHECK.  Same exclusions as cap-window-lower.  In addition it
# does not check that a superlinear cap is COMPUTATIONALLY tolerable; the paper
# says only that the cap is a computational budget and not a rate condition, so
# nothing in eq:phirate moves with it (results.tex).
#
# FALSIFICATION (hand-computed).  claimed_end "n**(29/24)" or "n**(28/25)" leaves
# a nonzero residual; MISMATCH.  Substituting beta_x = 16/125 (the other endpoint)
# gives 106/125 != 29/25; MISMATCH.
#
# PREDICTED: MATCH.
variables:
  n:
    domain: positive
  beta_u:
    domain: positive
  beta_x:
    domain: positive
  alpha:
    domain: positive
start: "(n**(-beta_u))**(-2) * (n**(-beta_x))**(-1) * (n**(-alpha))**(-2)"
operation: "substitute(beta_u=1/25, beta_x=11/25, alpha=8/25)"
claimed_end: "n**(29/25)"
